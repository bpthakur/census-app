          <option value="5">5 - কেরোসিন</option>
          <option value="6">6 - রান্নার গ্যাস (এল.পি.জি. / পি.এন.জি.)</option>

      <div class="form-group">

        <select id="q26">

          <option value="2">2 - হ্যাঁ : মোবাইলে/স্মার্টফোনে</option>
          <option value="3">3 - হ্যাঁ : অন্য কোনো যন্ত্রের মাধ্যমে</option>

      </div>

      <!-- 27. টেলিভিশন -->
      <div class="form-group">
        <label>27. টেলিভিশন :</label>
        <select id="q27">
          <option value="1">1 - হ্যাঁ : বিনামূল্যে দূরদর্শনের ডিশ অ্যান্টেনা</option>
          <option value="2">2 - হ্যাঁ : অন্যান্য ডি.টি.এইচ./ডিশ</option>
          <option value="3">3 - হ্যাঁ : কেবল্ সংযোগ</option>
          <option value="4">4 - হ্যাঁ : অন্যান্য</option>

      </div>

      <!-- 28. ইন্টারনেটের উপলব্ধতা -->
      <div class="form-group">

        <select id="q28">
          <option value="1">1 - হ্যাঁ : ল্যাপটপ/কম্পিউটারে</option>
          <option value="2">2 - হ্যাঁ : মোবাইল/স্মার্টফোনে</option>
          <option value="3">3 - হ্যাঁ : অন্য কোনো যন্ত্রের মাধ্যমে</option>
          <option value="4">4 - না</option>
        </select>
      </div>

      <!-- 29. ল্যাপটপ/কম্পিউটার -->
      <div class="form-group">
        <label>29. ল্যাপটপ/কম্পিউটার :</label>
        <select id="q29">
          <option value="1">1 - হ্যাঁ</option>
          <option value="2">2 - না</option>
        </select>
      </div>
      <!-- 30. টেলিফোন এবং মোবাইল ফোন/স্মার্টফোন -->
      <div class="form-group">
        <label>30. টেলিফোন এবং মোবাইল ফোন/স্মার্টফোন :</label>
        <select id="q30">
          <option value="1">1 - হ্যাঁ : শুধুমাত্র ল্যান্ডলাইন</option>
          <option value="2">2 - হ্যাঁ : শুধুমাত্র স্মার্টফোন</option>
          <option value="3">3 - হ্যাঁ : অন্যান্য সাধারণ মোবাইল ফোন</option>
          <option value="4">4 - হ্যাঁ : উভয়ই</option>

        <label>31. সাইকেল এবং স্কুটার/মোটর সাইকেল/মোপেড :</label>
        <select id="q31">
          <option value="1">1 - সাইকেল</option>
          <option value="2">2 - স্কুটার/মোটর সাইকেল/মোপেড</option>

      <div class="form-group"><label>32. চার চাকা গাড়ি/ভ্যান আছে?</label><select id="q32"><option>1.হ্যাঁ</option><option>2.না</option></select></div>

      <!-- 33. প্রধান খাদ্যশস্য -->
      <div class="form-group">
        <label>33. পরিবারটি প্রধানত কোন খাদ্যশস্য গ্রহণ করে :</label>
        <select id="q33">
          <option value="1">1 - ধানজাত</option>
          <option value="2">2 - গমজাত</option>
          <option value="3">3 - জোয়ারজাত</option>
          <option value="4">4 - বাজরাজাত</option>
          <option value="5">5 - ভূট্টাজাত</option>

      <!-- Remarks Field -->
      <div class="form-group" style="border-left-color: #8e44ad;">
        <label>Remarks / মন্তব্য (যদি থাকে)</label>
        <textarea id="remarks" rows="2" placeholder="এখানে কোনো বিশেষ মন্তব্য লিখুন..."></textarea>
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">তথ্য জমা দিন (Save Data)</button>

  </div>

 <!-- Tab 2: Data & Search -->
  <div id="data-tab" class="tab-content">
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="প্রধানের নাম, ফোন নম্বর বা গৃহ নং দিয়ে খুঁজুন..." onkeyup="filterTable()">
      <button type="button" class="btn-print" onclick="window.print()">
        🖨️ প্রিন্ট করুন
      </button>
    </div>

    <div id="print-area" style="overflow-x:auto;">
      <table id="dataTable">
        <thead>
          <tr>
            <th>User</th>
            <th>লাইন</th>
            <th>বাড়ি নং</th>
            <th>প্রধানের নাম</th>
            <th>সদস্য</th>
            <th>মোবাইল</th>
            <th>Remarks</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <!-- Data populated via JS -->
        </tbody>
      </table>
    </div>
  </div>
</div>

<script>
  // Google Apps Script Web App URL 
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwxeHfcbEPx53NajCqr1JuyHCuSgRK5Phkh5Lgg4k7DKnXy5EI6-XVkiRwJSrSzmdb6/exec';
  let globalData = [];

  function switchTab(tabId) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
    document.getElementById(tabId).classList.add('active');
    event.target.classList.add('active');
  }

  document.getElementById('censusForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.innerText = "জমা হচ্ছে...";

    const editId = document.getElementById('edit_record_id').value;
    const recordId = editId ? editId : 'ID_' + Date.now();

    const rowValues = [
      recordId,
      document.getElementById('user_id').value,
      document.getElementById('q1').value,
      document.getElementById('q2').value,
      document.getElementById('q3').value,
      document.getElementById('q4').value,
      document.getElementById('q5').value,
      document.getElementById('q6').value,
      document.getElementById('q7').value,
      document.getElementById('q8').value,
      document.getElementById('q9').value,
      document.getElementById('q10').value,
      document.getElementById('q11').value,
      document.getElementById('q12').value,
      document.getElementById('q13').value,
      document.getElementById('q14').value,
      document.getElementById('q15').value,
      document.getElementById('q16').value,
      document.getElementById('q17').value,
      document.getElementById('q18').value,
      document.getElementById('q19').value,
      document.getElementById('q20').value,
      document.getElementById('q21').value,
      document.getElementById('q22').value,
      document.getElementById('q23').value,
      document.getElementById('q24').value,
      document.getElementById('q25').value,
      document.getElementById('q26').value,
      document.getElementById('q27').value,
      document.getElementById('q28').value,
      document.getElementById('q29').value,
      document.getElementById('q30').value,
      document.getElementById('q31').value,
      document.getElementById('q32').value,
      document.getElementById('q33').value,
      document.getElementById('q34').value,
      document.getElementById('remarks').value
    ];

    const payload = {
      action: editId ? "update" : "create",
      id: recordId,
      rowValues: rowValues
    };

    fetch(SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify(payload)
    })
    .then(res => res.json())
    .then(data => {
      alert(editId ? 'তথ্য সফলভাবে আপডেট করা হয়েছে!' : 'তথ্য সফলভাবে জমা হয়েছে!');
      document.getElementById('censusForm').reset();
      document.getElementById('edit_record_id').value = '';
      btn.disabled = false;
      btn.innerText = "তথ্য জমা দিন (Save Data)";
    })
    .catch(err => {
      alert('ত্রুটি হয়েছে, আবার চেষ্টা করুন!');
      btn.disabled = false;
      btn.innerText = "তথ্য জমা দিন (Save Data)";
    });
  });

  function loadData() {
    const tbody = document.getElementById('tableBody');
    tbody.innerHTML = '<tr><td colspan="8">ডাটা লোড হচ্ছে...</td></tr>';
    
    fetch(SCRIPT_URL)
    .then(res => res.json())
    .then(data => {
      globalData = data;
      renderTable(data);
    });
  }

  function renderTable(data) {
    const tbody = document.getElementById('tableBody');
    tbody.innerHTML = '';
    data.forEach((row) => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${row[1] || ''}</td>
        <td>${row[2] || ''}</td>
        <td>${row[4] || ''}</td>
        <td>${row[12] || ''}</td>
        <td>${row[11] || ''}</td>
        <td>${row[35] || ''}</td>
        <td>${row[36] || ''}</td>
        <td>
          <button class="action-btn edit-btn" onclick="editRow('${row[0]}')">Edit</button>
          <button class="action-btn delete-btn" onclick="deleteRow('${row[0]}')">Delete</button>
        </td>
      `;
      tbody.appendChild(tr);
    });
  }

  function editRow(id) {
    const row = globalData.find(r => r[0] == id);
    if (!row) return;

    switchTab('form-tab');
    document.getElementById('edit_record_id').value = row[0];
    document.getElementById('user_id').value = row[1];
    document.getElementById('q1').value = row[2];
    document.getElementById('q2').value = row[3];
    document.getElementById('q3').value = row[4];
    document.getElementById('q4').value = row[5];
    document.getElementById('q5').value = row[6];
    document.getElementById('q6').value = row[7];
    document.getElementById('q7').value = row[8];
    document.getElementById('q8').value = row[9];
    document.getElementById('q9').value = row[10];
    document.getElementById('q10').value = row[11];
    document.getElementById('q11').value = row[12];
    document.getElementById('q12').value = row[13];
    document.getElementById('q13').value = row[14];
    document.getElementById('q14').value = row[15];
    document.getElementById('q15').value = row[16];
    document.getElementById('q16').value = row[17];
    document.getElementById('q17').value = row[18];
    document.getElementById('q18').value = row[19];
    document.getElementById('q19').value = row[20];
    document.getElementById('q20').value = row[21];
    document.getElementById('q21').value = row[22];
    document.getElementById('q22').value = row[23];
    document.getElementById('q23').value = row[24];
    document.getElementById('q24').value = row[25];
    document.getElementById('q25').value = row[26];
    document.getElementById('q26').value = row[27];
    document.getElementById('q27').value = row[28];
    document.getElementById('q28').value = row[29];
    document.getElementById('q29').value = row[30];
    document.getElementById('q30').value = row[31];
    document.getElementById('q31').value = row[32];
    document.getElementById('q32').value = row[33];
    document.getElementById('q33').value = row[34];
    document.getElementById('q34').value = row[35];
    document.getElementById('remarks').value = row[36] || '';

    document.getElementById('submitBtn').innerText = "আপডেট করুন (Update Data)";
  }

  function deleteRow(id) {
    if (!confirm('আপনি কি এই তথ্যটি স্থায়ীভাবে মুছে ফেলতে চান?')) return;

    fetch(SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify({ action: "delete", id: id })
    })
    .then(res => res.json())
    .then(data => {
      alert('তথ্য সফলভাবে মুছে ফেলা হয়েছে!');
      loadData();
    });
  }

  function filterTable() {
    const input = document.getElementById('searchInput').value.toLowerCase();
    const filtered = globalData.filter(row => 
      (row[12] && row[12].toString().toLowerCase().includes(input)) ||
      (row[35] && row[35].toString().toLowerCase().includes(input)) ||
      (row[4] && row[4].toString().toLowerCase().includes(input))
    );
    renderTable(filtered);
  }
</script>
</body>
</html>
